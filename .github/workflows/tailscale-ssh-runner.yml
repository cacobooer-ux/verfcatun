name: Ubuntu Tailscale SSH Runner

"on":
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ubuntu-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install OpenSSH server and tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server curl git zstd openssl
      - name: Checkout selected repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ github.token }}
      - name: Initialize backup folder
        run: |
          set -euo pipefail
          mkdir -p backup
          touch backup/.gitkeep
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup/.gitkeep
          git commit -m "Initialize ReVBS backup folder" || echo "Backup folder already exists"
          git push || echo "Backup folder push was already applied"
      - name: Restore latest ReVBS system snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REVBS_BACKUP_KEY: ${{ secrets.REVBS_BACKUP_KEY }}
        run: |
          set -euo pipefail
          BACKUP_DIR="$(mktemp -d)"
          if git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BACKUP_DIR/repo" 2>/dev/null; then
            if [[ -s "$BACKUP_DIR/repo/backup/linux-backup.img" ]]; then
              echo 'Restoring encrypted ReVBS linux-backup.img...'
              printf '%s' "$REVBS_BACKUP_KEY" | sudo tee "$BACKUP_DIR/key" >/dev/null
              sudo chmod 600 "$BACKUP_DIR/key"
              sudo sh -c "openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass file='$BACKUP_DIR/key' -in '$BACKUP_DIR/repo/backup/linux-backup.img' | zstd -d | tar --extract --absolute-names --preserve-permissions --same-owner -C /"
              if [[ -s "$BACKUP_DIR/repo/backup/packages.txt" ]]; then
                echo 'Restoring package selections from packages.txt...'
                sudo dpkg --set-selections < "$BACKUP_DIR/repo/backup/packages.txt" || true
                sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq || true
                sudo DEBIAN_FRONTEND=noninteractive apt-get dselect-upgrade -y || true
              fi
              echo 'ReVBS linux-backup.img restored.'
            else
              echo 'No ReVBS snapshot found; starting from a clean runner.'
            fi
          else
            echo "No backup found on ${GITHUB_REF_NAME:-main}; starting from a clean runner."
          fi
          rm -rf "$BACKUP_DIR"
      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm i -g opencode-ai
          opencode --version
      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version
      - name: Start OpenCode web tunnel
        run: |
          set -euo pipefail
          OPENCODE_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$OPENCODE_PASSWORD" > /tmp/opencode-password
          chmod 600 /tmp/opencode-password
          OPENCODE_SERVER_PASSWORD="$OPENCODE_PASSWORD" nohup opencode web --hostname 0.0.0.0 --port 4096 >/tmp/opencode-web.log 2>&1 &
          echo $! >/tmp/opencode-web.pid
          for _ in {1..30}; do
            if curl -fsS -u "opencode:$OPENCODE_SERVER_PASSWORD" http://127.0.0.1:4096/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS -u "opencode:$OPENCODE_SERVER_PASSWORD" http://127.0.0.1:4096/ >/dev/null
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4096 >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          for _ in {1..30}; do
            OPENCODE_URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            [[ -n "$OPENCODE_URL" ]] && break
            sleep 2
          done
          [[ -n "${OPENCODE_URL:-}" ]] || { cat /tmp/cloudflared.log; exit 1; }
          echo "OPENCODE_URL=$OPENCODE_URL" >> "$GITHUB_ENV"
          echo "========================================"
          echo "OPENCODE_URL=$OPENCODE_URL"
          echo "OpenCode username: opencode"
          echo "========================================"
      - name: Configure OpenSSH
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sudo install -d -m 700 -o runner -g runner /home/runner/.ssh
          printf '%s\n' "$SSH_PUBLIC_KEY" | sudo tee /home/runner/.ssh/authorized_keys >/dev/null
          sudo chown runner:runner /home/runner/.ssh/authorized_keys
          sudo chmod 600 /home/runner/.ssh/authorized_keys
          printf 'runner:%s\n' "$SSH_PASSWORD" | sudo chpasswd
          printf '%s\n' 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/runner-password.conf >/dev/null
          printf '%s\n' 'PubkeyAuthentication yes' | sudo tee -a /etc/ssh/sshd_config.d/runner-password.conf >/dev/null
          sudo install -d -m 0755 /run/sshd
          sudo sshd -t
          sudo systemctl enable --now ssh
          sudo systemctl restart ssh
      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh
      - name: Connect to Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname="gh-ubuntu-${GITHUB_RUN_ID}"
          IP="$(tailscale ip -4 | head -n1)"
          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"
          echo "SSH_COMMAND=ssh runner@$IP" >> "$GITHUB_ENV"
          echo "OPENCODE_TAILSCALE_URL=http://$IP:4096" >> "$GITHUB_ENV"
          echo "========================================"
          echo "TAILSCALE_IP=$IP"
          echo "SSH_COMMAND=ssh runner@$IP"
          echo "OPENCODE_TAILSCALE_URL=http://$IP:4096"
          echo "========================================"
      - name: Publish runner connection status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OPENCODE_PASSWORD_ENC="$(openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -pass pass:"$REVBS_BACKUP_KEY" -in /tmp/opencode-password | base64 -w 0)"
          STATUS="RUN_ID=$GITHUB_RUN_ID\nTAILSCALE_IP=$TAILSCALE_IP\nSSH_COMMAND=ssh runner@$TAILSCALE_IP\nOPENCODE_TAILSCALE_URL=$OPENCODE_TAILSCALE_URL\nOPENCODE_URL=$OPENCODE_URL\nOPENCODE_PASSWORD_ENC=$OPENCODE_PASSWORD_ENC\nSTATUS=ready\n"
          CONTENT="$(printf '%b' "$STATUS" | base64 -w 0)"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/runner-status/$GITHUB_RUN_ID.txt" \
            -d "{\"message\":\"Publish runner connection status\",\"content\":\"$CONTENT\"}"
      - name: Show runner status
        run: |
          set -e
          echo "Runner: $(whoami)"
          echo "Hostname: $(hostname)"
          echo "SSH service:"
          sudo systemctl --no-pager --full status ssh || true
          echo "Listening ports:"
          ss -lnt
      - name: Keep SSH runner alive
        env:
          GH_TOKEN: ${{ github.token }}
          REVBS_BACKUP_KEY: ${{ secrets.REVBS_BACKUP_KEY }}
        run: |
          set -euo pipefail
          backup_once() {
            work="$(mktemp -d)"
            echo "[ReVBS] Creating whitelist image..."
            sudo dpkg --get-selections > "$work/packages.txt"
            sudo apt-get clean || true
            set +e
            sudo tar --create --zstd --file "$work/system.tar.zst" \
              --absolute-names --ignore-failed-read --warning=no-file-changed \
              --exclude=/etc/ssl/certs --exclude=/etc/ca-certificates \
              --exclude=/etc/alternatives --exclude=/etc/ld.so.cache \
              --exclude=/home/runner/.cache --exclude=/home/runner/.git \
              --exclude=/home/runner/work --exclude=/home/runner/_work \
              --exclude=/home/runner/.local/lib --exclude=/home/runner/.npm \
              --exclude=/home/runner/.rustup --exclude=/home/runner/.cargo \
              /etc/ssh /etc/systemd/system /etc/apt/sources.list.d \
              /etc/environment /home/runner/.config /home/runner/.ssh \
              /home/runner/.local/bin /usr/local/bin /usr/local/sbin \
              /srv /var/spool/cron/crontabs
            tar_status=$?
            set -e
            if (( tar_status > 1 )); then
              echo "[ReVBS] tar failed with exit code $tar_status"
              rm -rf "$work"
              return 1
            fi
            if (( tar_status == 1 )); then
              echo '[ReVBS] tar completed with changing-file warnings; continuing.'
            fi
            [[ -s "$work/system.tar.zst" ]] || { echo '[ReVBS] archive was not created'; rm -rf "$work"; return 1; }
            echo '[ReVBS] Encrypting linux-backup.img...'
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt \
              -pass env:REVBS_BACKUP_KEY -in "$work/system.tar.zst" \
              -out "$work/linux-backup.img"
            size="$(stat -c '%s' "$work/linux-backup.img")"
            echo "[ReVBS] Encrypted image size: ${size} bytes"
            if (( size > 90000000 )); then
              echo "ReVBS linux-backup.img is ${size} bytes; refusing upload above 90 MB."
              rm -rf "$work"
              return 1
            fi
            echo "[ReVBS] Writing backup files to $GITHUB_WORKSPACE/backup..."
            mkdir -p "$GITHUB_WORKSPACE/backup"
            cp "$work/linux-backup.img" "$GITHUB_WORKSPACE/backup/linux-backup.img"
            cp "$work/packages.txt" "$GITHUB_WORKSPACE/backup/packages.txt"
            printf '{\"run_id\":\"%s\",\"created_at\":\"%s\",\"bytes\":%s,\"format\":\"encrypted-tar-zst-linux-image\",\"scope\":\"practical-system\"}\n' \
              "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$size" > "$GITHUB_WORKSPACE/backup/checkpoint.json"
            cd "$GITHUB_WORKSPACE"
            git add backup
            if git diff --cached --quiet; then
              echo '[ReVBS] No backup changes to commit.'
            else
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m "ReVBS snapshot ${GITHUB_RUN_ID}"
              echo "[ReVBS] Uploading backup to ${GITHUB_REF_NAME:-main}..."
              git push origin "HEAD:${GITHUB_REF_NAME:-main}" || { echo '[ReVBS] git push failed; check Contents: write and branch protection.'; rm -rf "$work"; return 1; }
            fi
            rm -rf "$work"
            echo "ReVBS backup updated: ${size} bytes"
          }
          backup_once || echo 'Initial ReVBS backup failed; retrying in 5 minutes.'
          while true; do
            echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] SSH runner alive at $TAILSCALE_IP"
            sleep 300
            backup_once || echo 'ReVBS backup attempt failed; retrying in 5 minutes.'
          done
