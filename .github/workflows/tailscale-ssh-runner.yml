name: Ubuntu Tailscale SSH Runner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ubuntu-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install OpenSSH server and tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server curl git zstd openssl
      - name: Checkout selected repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ github.token }}
      - name: Restore runner home from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SUPABASE_BACKUP_PATH: ${{ secrets.SUPABASE_BACKUP_PATH }}
          SUPABASE_BACKUP_ENCRYPTION_KEY: ${{ secrets.SUPABASE_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_URL:-}" && -n "${SUPABASE_SERVICE_ROLE_KEY:-}" && -n "${SUPABASE_BUCKET:-}" && -n "${SUPABASE_BACKUP_PATH:-}" && -n "${SUPABASE_BACKUP_ENCRYPTION_KEY:-}" ]] || { echo 'Supabase backup is not configured; starting clean.'; exit 0; }
          bucket="${SUPABASE_BUCKET#/}"
          backup_base="${SUPABASE_BACKUP_PATH#/}"
          manifest_path="${backup_base}.manifest.json"
          manifest_url="${SUPABASE_URL%/}/storage/v1/object/${bucket}/${manifest_path}"
          manifest_file=/tmp/runner-home.manifest.json
          response_file=/tmp/supabase-manifest-response
          http_code="$(curl -sS -o "$response_file" -w '%{http_code}' --retry 3 -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" "$manifest_url" || true)"
          if [[ "$http_code" == 404 || ( "$http_code" == 400 && ( "$(grep -c 'NoSuchKey\|\"statusCode\":\"404\"' "$response_file" 2>/dev/null || true)" -gt 0 ) ) ]]; then
            echo 'No backup found in Supabase; starting with a clean runner.'
            rm -f "$response_file"
            exit 0
          fi
          if [[ "$http_code" != 2* ]]; then
            echo "Supabase backup manifest download failed with HTTP $http_code"
            head -c 1000 "$response_file" || true; echo
            rm -f "$response_file"
            exit 1
          fi
          mv "$response_file" "$manifest_file"
          generation="$(python3 - "$manifest_file" <<'PY'
import json,sys
print(json.load(open(sys.argv[1]))['generation'])
PY
)"
          parts="$(python3 - "$manifest_file" <<'PY'
import json,sys
print(json.load(open(sys.argv[1]))['parts'])
PY
)"
          encrypted=/tmp/runner-home.tar.zst.enc
          : > "$encrypted"
          for i in $(seq 0 $((parts - 1))); do
            part_path="${backup_base}.gen-${generation}.part-$(printf '%06d' "$i")"
            part_url="${SUPABASE_URL%/}/storage/v1/object/${bucket}/${part_path}"
            part_file="/tmp/runner-home.part.$i"
            curl -fsSL --retry 3 -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" "$part_url" -o "$part_file"
            cat "$part_file" >> "$encrypted"
            rm -f "$part_file"
          done
          echo 'Supabase backup found; restoring /home/runner...'
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass env:SUPABASE_BACKUP_ENCRYPTION_KEY -in "$encrypted" | zstd -d | sudo tar --extract --directory=/home/runner --no-same-owner --warning=no-file-changed
          sudo chown -R runner:runner /home/runner/.config /home/runner/.local /home/runner/.ssh 2>/dev/null || true
          rm -f "$encrypted" "$manifest_file"
          echo 'Supabase backup restored.'
      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm i -g opencode-ai
          opencode --version
      - name: Install ntfy notification skill
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/opencode/skills/ntfy-notifications"
          cat > "$HOME/.config/opencode/skills/ntfy-notifications/SKILL.md" <<'SKILL'
          ---
          name: ntfy-notifications
          description: Send a completion notification through ntfy when the user explicitly asks to be notified after finishing work.
          ---

          # ntfy completion notifications

          Use this skill only when the user explicitly requests a completion notification, including wording such as "notify me when you finish", "notify me when you're done", "send me a notification when finished", or equivalent wording.

          The ntfy topic URL is provided in the `NTFY_URL` environment variable. Never reveal, print, commit, or include this URL in normal responses, logs, code, or status output.

          When the requested work is genuinely complete, send one concise notification with:

          ```bash
          curl --fail --silent --show-error --max-time 20 \\
            -H 'Title: OpenCode task finished' \\
            -H 'Tags: white_check_mark' \\
            --data-raw 'OpenCode finished the requested task.' \\
            "$NTFY_URL"
          ```

          If `NTFY_URL` is empty, do not attempt a request and tell the user that ntfy is not configured. Do not send notifications for ordinary tasks unless the user asked for one. Do not claim that a notification was sent unless the curl command succeeds.
          SKILL
          chmod 600 "$HOME/.config/opencode/skills/ntfy-notifications/SKILL.md"
      - name: Enable OpenCode automatic permissions
        run: |
          set -euo pipefail
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": "allow"
          }
          JSON
      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version
      - name: Start OpenCode web tunnel
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          set -euo pipefail
          OPENCODE_PASSWORD="$(openssl rand -hex 24)"
          OPENCODE_SERVER_PASSWORD="$OPENCODE_PASSWORD"
          export OPENCODE_SERVER_PASSWORD
          printf '%s' "$OPENCODE_PASSWORD" > /tmp/opencode-password
          chmod 600 /tmp/opencode-password
          nohup opencode web --hostname 0.0.0.0 --port 4096 >/tmp/opencode-web.log 2>&1 &
          echo $! >/tmp/opencode-web.pid
          for _ in {1..30}; do
            if curl -fsS -u "opencode:$OPENCODE_SERVER_PASSWORD" http://127.0.0.1:4096/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          if ! curl -fsS -u "opencode:$OPENCODE_SERVER_PASSWORD" http://127.0.0.1:4096/ >/dev/null; then
            echo 'OpenCode failed to start. Log output:'
            cat /tmp/opencode-web.log || true
            exit 1
          fi
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4096 >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          for _ in {1..30}; do
            OPENCODE_URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            [[ -n "$OPENCODE_URL" ]] && break
            sleep 2
          done
          [[ -n "${OPENCODE_URL:-}" ]] || { cat /tmp/cloudflared.log; exit 1; }
          echo "OPENCODE_URL=$OPENCODE_URL" >> "$GITHUB_ENV"
          echo "========================================"
          echo "OPENCODE_URL=$OPENCODE_URL"
          echo "OpenCode username: opencode"
          echo "========================================"
      - name: Configure OpenSSH
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sudo install -d -m 700 -o runner -g runner /home/runner/.ssh
          printf '%s\n' "$SSH_PUBLIC_KEY" | sudo tee /home/runner/.ssh/authorized_keys >/dev/null
          sudo chown runner:runner /home/runner/.ssh/authorized_keys
          sudo chmod 600 /home/runner/.ssh/authorized_keys
          printf 'runner:%s\n' "$SSH_PASSWORD" | sudo chpasswd
          printf '%s\n' 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/runner-password.conf >/dev/null
          printf '%s\n' 'PubkeyAuthentication yes' | sudo tee -a /etc/ssh/sshd_config.d/runner-password.conf >/dev/null
          sudo install -d -m 0755 /run/sshd
          sudo sshd -t
          sudo systemctl enable --now ssh
          sudo systemctl restart ssh
      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh
      - name: Connect to Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname="gh-ubuntu-${GITHUB_RUN_ID}"
          IP="$(tailscale ip -4 | head -n1)"
          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"
          echo "SSH_COMMAND=ssh runner@$IP" >> "$GITHUB_ENV"
          echo "OPENCODE_TAILSCALE_URL=http://$IP:4096" >> "$GITHUB_ENV"
          echo "========================================"
          echo "TAILSCALE_IP=$IP"
          echo "SSH_COMMAND=ssh runner@$IP"
          echo "OPENCODE_TAILSCALE_URL=http://$IP:4096"
          echo "========================================"
      - name: Publish runner connection status
        env:
          GH_TOKEN: ${{ github.token }}
          REVBS_BACKUP_KEY: ${{ secrets.REVBS_BACKUP_KEY }}
        run: |
          set -euo pipefail
          OPENCODE_PASSWORD_ENC="$(openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -pass pass:"$REVBS_BACKUP_KEY" -in /tmp/opencode-password | base64 -w 0)"
          STATUS="RUN_ID=$GITHUB_RUN_ID\nTAILSCALE_IP=$TAILSCALE_IP\nSSH_COMMAND=ssh runner@$TAILSCALE_IP\nOPENCODE_TAILSCALE_URL=$OPENCODE_TAILSCALE_URL\nOPENCODE_URL=$OPENCODE_URL\nOPENCODE_PASSWORD_ENC=$OPENCODE_PASSWORD_ENC\nSTATUS=ready\n"
          CONTENT="$(printf '%b' "$STATUS" | base64 -w 0)"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/runner-status/$GITHUB_RUN_ID.txt" \
            -d "{\"message\":\"Publish runner connection status\",\"content\":\"$CONTENT\"}"
      - name: Show runner status
        run: |
          set -e
          echo "Runner: $(whoami)"
          echo "Hostname: $(hostname)"
          echo "SSH service:"
          sudo systemctl --no-pager --full status ssh || true
          echo "Listening ports:"
          ss -lnt
      - name: Keep SSH runner alive and back up to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SUPABASE_BACKUP_PATH: ${{ secrets.SUPABASE_BACKUP_PATH }}
          SUPABASE_BACKUP_ENCRYPTION_KEY: ${{ secrets.SUPABASE_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          backup_once() {
            [[ -n "${SUPABASE_URL:-}" && -n "${SUPABASE_SERVICE_ROLE_KEY:-}" && -n "${SUPABASE_BUCKET:-}" && -n "${SUPABASE_BACKUP_PATH:-}" && -n "${SUPABASE_BACKUP_ENCRYPTION_KEY:-}" ]] || { echo 'Supabase backup is not configured; skipping backup.'; return 0; }
            local work archive size object_url bucket backup_base manifest_path generation old_manifest old_generation parts part_path http_code tar_status
            work="$(mktemp -d)"
            archive="$work/runner-home.tar.zst.enc"
            bucket="${SUPABASE_BUCKET#/}"
            backup_base="${SUPABASE_BACKUP_PATH#/}"
            manifest_path="${backup_base}.manifest.json"
            generation="${GITHUB_RUN_ID}-$(date +%s)"
            echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Creating /home/runner backup (excluding actions-runner and work)..."
            set +e
            sudo tar --create --zstd --file="$work/runner-home.tar.zst" \
              --directory=/home/runner --ignore-failed-read --warning=no-file-changed \
              --exclude=./actions-runner --exclude=./work .
            tar_status=$?
            set -e
            if (( tar_status > 1 )); then echo "Backup tar failed with exit code $tar_status"; rm -rf "$work"; return 1; fi
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:SUPABASE_BACKUP_ENCRYPTION_KEY -in "$work/runner-home.tar.zst" -out "$archive"
            size="$(stat -c '%s' "$archive")"
            split -b 45M -d -a 6 "$archive" "$work/part-"
            parts="$(find "$work" -maxdepth 1 -name 'part-*' | wc -l | tr -d ' ')"
            object_url="${SUPABASE_URL%/}/storage/v1/object/${bucket}"
            old_manifest="$work/old-manifest.json"
            old_generation=""
            if curl -fsSL --retry 2 -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" "$object_url/$manifest_path" -o "$old_manifest" 2>/dev/null; then
              old_generation="$(python3 - "$old_manifest" <<'PY'
import json,sys
try: print(json.load(open(sys.argv[1])).get('generation',''))
except Exception: print('')
PY
)"
            fi
            for part in "$work"/part-*; do
              index="${part##*-}"
              part_path="${backup_base}.gen-${generation}.part-${index}"
              http_code="$(curl -sS -o /tmp/supabase-upload-response -w '%{http_code}' --retry 3 -X POST -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H 'x-upsert: true' -H 'Content-Type: application/octet-stream' --data-binary @"$part" "$object_url/$part_path" || true)"
              [[ "$http_code" == 2* ]] || { echo "Supabase backup part upload failed with HTTP $http_code"; cat /tmp/supabase-upload-response 2>/dev/null || true; rm -rf "$work"; return 1; }
            done
            python3 - "$work/manifest.json" "$generation" "$parts" "$size" <<'PY'
import json,sys,datetime
json.dump({'generation':sys.argv[2],'parts':int(sys.argv[3]),'bytes':int(sys.argv[4]),'created_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'format':'encrypted-tar-zstd-home-runner','exclude':['actions-runner','work']},open(sys.argv[1],'w'))
PY
            http_code="$(curl -sS -o /tmp/supabase-manifest-upload-response -w '%{http_code}' --retry 3 -X POST -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H 'x-upsert: true' -H 'Content-Type: application/json' --data-binary @"$work/manifest.json" "$object_url/$manifest_path" || true)"
            [[ "$http_code" == 2* ]] || { echo "Supabase backup manifest upload failed with HTTP $http_code"; cat /tmp/supabase-manifest-upload-response 2>/dev/null || true; rm -rf "$work"; return 1; }
            if [[ -n "$old_generation" && "$old_generation" != "$generation" ]]; then
              old_paths="$(python3 - "$backup_base" "$old_generation" "$parts" <<'PY'
import json,sys
# The manifest is not available here, so request cleanup for a conservative range.
# The next run's manifest remains authoritative if cleanup cannot remove old parts.
paths=[f"{sys.argv[1]}.gen-{sys.argv[2]}.part-{i:06d}" for i in range(0,1000)]
print(json.dumps({'prefixes':paths}))
PY
)"
              curl -sS --max-time 60 -X POST -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' -d "$old_paths" "${SUPABASE_URL%/}/storage/v1/object/remove" >/dev/null || true
            fi
            rm -rf "$work"
            echo "Supabase backup replaced successfully: ${size} bytes in ${parts} parts"
          }
          trap 'backup_once || true; exit 0' TERM INT
          backup_once || echo 'Initial Supabase backup failed; retrying in 5 minutes.'
          while true; do
            echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] SSH runner alive at $TAILSCALE_IP"
            sleep 300
            backup_once || echo 'Supabase backup attempt failed; retrying in 5 minutes.'
          done
