<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
</head>
<body style="font-family:sans-serif;text-align:center;margin-top:80px">

<h2>Reset your password</h2>

<input id="pass" type="password" placeholder="New password" />
<br><br>
<button onclick="reset()">Change Password</button>

<p id="msg"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://hmddrhgxwotsgwzodmmm.supabase.co";
const SUPABASE_ANON = "PUT_YOUR_ANON_KEY_HERE";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// يقرأ التوكن من الرابط ويعمل تسجيل دخول مؤقت
(async () => {
  const hash = window.location.hash;
  if (hash.includes("access_token")) {
    document.getElementById("msg").innerText = "You can now set a new password";
  } else {
    document.getElementById("msg").innerText = "Invalid or expired link";
  }
})();

async function reset() {
  const password = document.getElementById("pass").value;

  const { error } = await supabase.auth.updateUser({
    password: password
  });

  if (error)
    document.getElementById("msg").innerText = error.message;
  else
    document.getElementById("msg").innerText = "Password changed successfully ✔";
}
</script>

</body>
</html>
